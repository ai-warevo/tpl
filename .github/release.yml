changelog:
  categories:
    - title: ✨ New Features
      labels:
        - feat
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
    - title: ♻️ Refactoring & Core
      labels:
        - refactor
        - perf
    - title: 🧪 Tests & CI
      labels:
        - test
        - ci
    - title: 📚 Documentation
      labels:
        - docs
    - title: 🔧 Other Changes
      labels:
        - "*"
