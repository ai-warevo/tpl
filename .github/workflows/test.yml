name: Tests & Coverage

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  quality-and-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Configure & Build Tests with Coverage
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAW_TPL_BUILD_EXAMPLES=OFF \
            -DAW_TPL_BUILD_TESTS=ON \
            -DAW_TPL_ENABLE_COVERAGE=ON
          cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Generate Coverage Reports (XML & HTML)
        run: |
          mkdir -p htmlcov
          gcovr -r . \
            --filter "include/aw/tpl/" \
            --filter "src/" \
            --exclude-unreachable-branches \
            --exclude-throw-branches \
            --print-summary \
            --xml coverage.xml \
            --html-details htmlcov/index.html

      - name: Parse Coverage Metrics
        id: coverage_parser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          PERCENTAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(int(float(root.attrib['line-rate']) * 100))")
          echo "DEBUG: Extracted percentage: '$PERCENTAGE'"

          if [ "$PERCENTAGE" -lt 50 ]; then 
            COLOR="#e05d44" 
          elif [ "$PERCENTAGE" -lt 80 ]; then 
            COLOR="#dfb317" 
          else 
            COLOR="#44cc11" 
          fi

          echo "percent=${PERCENTAGE}%" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Generate Coverage Badge
        id: badge_generator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: my-repositories/gha/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Isolate Badge for Deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          mkdir -p badge-upload
          cp "${{ steps.badge_generator.outputs.badge_path }}" badge-upload/coverage.svg

      - name: Deploy Badge to separate branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: badges
          folder: badge-upload
          target-folder: .
          git-config-name: "github-actions[bot]"
          git-config-email: "github-actions[bot]@users.noreply.github.com"
          single-commit: true

      - name: Preparation for HTML Deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          touch htmlcov/.nojekyll

      - name: Deploy Coverage Report to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: htmlcov
